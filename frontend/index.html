<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">AthleticaX</div>
    <ul>
      <li><a href="Welcome.html">Home</a></li>
      <li><a href="upcoming.html">Events</a></li>
      <li><a href="#">News</a></li>
      <li><a href="index.html">Login</a></li>
      <li><a href="register.html">Sign Up</a></li>
    </ul>
  </nav>

  <main>
    <div class="container">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="auth-btn">Login</button>
      </form>
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <!-- ✅ API FILE -->
  <script src="api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const result = await loginUser({ email, password });

      console.log("FULL LOGIN RESPONSE:", result); // ✅ DEBUG LINE

      if (!result || !result.user) {
        alert("❌ Invalid email or password");
        return;
      }

      // ✅ Save token + user
      localStorage.setItem("token", result.token);
      localStorage.setItem("activeUser", JSON.stringify(result.user));

      // ✅ Normalize role (fixes ADMIN vs admin issue)
      const role = result.user.role.toLowerCase();
      console.log("ROLE FROM BACKEND:", role);

      // ✅ Redirect properly
      if (role === "admin") {
        window.location.href = "admin.html";
      } 
      else if (role === "coach") {
        window.location.href = "index2.html";
      } 
      else if (role === "athlete") {
        window.location.href = "index1.html";
      } 
      else {
        alert("❌ Role not recognized: " + result.user.role);
      }

    } catch (err) {
      console.error("Login Error:", err);
      alert("❌ Something went wrong during login");
    }
  });
</script>

</body>
</html>
